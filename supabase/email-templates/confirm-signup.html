<!-- Supabase → Authentication → Emails → Confirm signup. Subject: Your Recipe Hub code: {{ .Token }} -->
<div style="background:#b04e1f;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;">
  <div style="max-width:420px;margin:0 auto;background:#fbf1e6;border-radius:28px;padding:36px 28px;text-align:center;color:#2a1714;">
    <div style="font-size:30px;font-weight:900;letter-spacing:-0.5px;line-height:0.95;color:#b04e1f;text-transform:uppercase;">Recipe<br>Hub</div>
    <h2 style="font-size:18px;margin:22px 0 8px;">Welcome to Recipe Hub</h2>
    <p style="margin:0 0 18px;font-size:15px;">Type this code into Recipe Hub to sign in:</p>
    <div style="display:inline-block;background:#ffffff;border-radius:999px;padding:14px 26px;font-size:32px;font-weight:900;letter-spacing:8px;color:#a0141e;">{{ .Token }}</div>
    <p style="margin:22px 0 6px;font-size:14px;">Or tap this button on the device you're signing in on:</p>
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#a0141e;color:#fff5ea;text-decoration:none;font-weight:700;border-radius:999px;padding:12px 24px;font-size:14px;letter-spacing:1px;text-transform:uppercase;">Sign in</a>
    <p style="margin:22px 0 0;font-size:12px;color:#7a5f55;">The code works once and expires soon. If you didn't ask for it, you can ignore this email.</p>
  </div>
</div>
